; Producción.
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Fotos: hasta 4 MB cada una (StoreProductoRequest) y varias por guardado.
upload_max_filesize = 8M
post_max_size = 64M
max_file_uploads = 50

date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; El código no cambia dentro del contenedor: cada deploy es una imagen nueva.
opcache.validate_timestamps = 0

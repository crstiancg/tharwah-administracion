server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash en el nombre (assets/…): caché larga, nunca cambian.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html sin caché: si no, tras un deploy el navegador seguiría
    # pidiendo los assets viejos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Router en modo history: /productos/22 al recargar cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
